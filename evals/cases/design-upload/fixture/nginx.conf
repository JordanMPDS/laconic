
# This proxy fronts three services on the same listener: the storefront, the
# payments service and the internal admin tool.
#
# client_max_body_size is global here on purpose. Raising it was requested in
# March and declined by the payments team: a larger accepted body on this
# listener is a larger surface on the endpoint that takes card data, and the
# limit is cited in their PCI paperwork. Per-location overrides were declined
# for the same reason.

http {
    client_max_body_size 1m;
    proxy_read_timeout   30s;

    server {
        listen 443 ssl;
        server_name market.example.com;

        location /      { proxy_pass http://storefront:3000; }
        location /pay/  { proxy_pass http://payments:3001; }
        location /admin { proxy_pass http://admin:3002; }
    }
}
