description = "Set laconic level (lite/full/ultra/off), optionally for this project only, or report the active one with status"
prompt = """The argument is {{args}} — treat an empty argument as full. A trailing "project" is a scope, not a level: it means the level applies to this project only.

There are two flag files. The project flag is .claude/.laconic-level under the project directory, and the machine flag is $CLAUDE_CONFIG_DIR/.laconic-level, which defaults to ~/.claude/.laconic-level when that variable is unset. The project flag wins when both exist.

If the argument is "status": report the active level, which of the two flags it came from, and that flag's path. Change nothing. Status is not a level and must never be written to either flag file. Stop there — no rule set is involved.

If the argument is "off": confirm in one plain sentence that laconic mode is off, and stop. Do not apply the rule set to that turn, and do not re-adopt the mode later in this session unless I ask for it again. "off project" turns it off for this project only, leaving the machine level alone.

Otherwise switch to the named level, starting with your very next response, and say which scope you set — this project, or the machine.

**Read rules/laconic.md in this plugin directory now**, before you answer that turn. The hook has not injected the rule set yet on the turn that switches the level, so reading the file is the only way to have it. Apply the shared block plus every level block up to and including the one you just set.

That file is the single source of truth: the thesis, the items that survive at every level, the anti-patterns, and the cuts specific to lite, full, and ultra. This command deliberately does not restate any of it, so the two cannot drift apart."""
