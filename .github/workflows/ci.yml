name: CI

# Pull requests only. The workflow used to carry `push: branches: ['**']`
# alongside `pull_request`, which fires both events for every push to a branch
# that has a PR open - two full matrix runs per push, for one change.
#
# Dropping the push trigger loses nothing. GitHub runs `pull_request` against
# the *merge* of the head into the base, not the branch head, so the thing CI
# verifies is what master would become. A separate run on master after the
# merge would re-test the same tree.
#
# This only guards master if the checks are required. See "Required checks" in
# the repository settings: without branch protection a direct push to master
# runs nothing at all.
on:
  pull_request:
  workflow_dispatch:

# A force-push supersedes the run it interrupts. Round records get amended and
# rebased more than once before they land, and each of those pushes used to
# leave a full matrix running to completion against a commit nobody would merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unix:
    name: bash suites (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The suites import nothing outside the standard library, so there is
      # nothing to install.
      - run: bash tests/test_rules.sh
      - run: bash tests/test_laconic.sh
      - run: bash tests/test_evals_layout.sh
      - run: python3 tests/test_metrics.py
      - run: python3 tests/test_bench.py

  windows:
    name: PowerShell suite (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell 5.1, not pwsh: 5.1 is what ships with the OS and is
      # therefore what a user without a Unix environment actually runs. Testing
      # only under pwsh would leave the shipped path unverified.
      - name: Report the interpreter under test
        shell: powershell
        run: $PSVersionTable | Format-List
      - name: Unit checks for hooks/laconic.ps1
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_laconic.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
