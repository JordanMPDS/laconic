description = "Set laconic level (lite/full/ultra/off), optionally for this project only, or report the active one with status"
prompt = """The argument is {{args}} — treat an empty argument as full. A trailing "project" is a scope, not a level: it means the level applies to this project only.

There are two flag files. The project flag is .claude/.laconic-level under the project directory, and the machine flag is $CLAUDE_CONFIG_DIR/.laconic-level, which defaults to ~/.claude/.laconic-level when that variable is unset. The project flag wins when both exist.

If the argument is "status": report the active level, which of the two flags it came from, and that flag's path. Change nothing. Status is not a level and must never be written to either flag file.

If the argument is "off": confirm in one plain sentence that laconic mode is off, and stop. Do not apply any of the guidance below to that turn, and do not re-adopt the mode later in this session unless I ask for it again. "off project" turns it off for this project only, leaving the machine level alone.

Otherwise switch to the named laconic level, starting with your very next response. Name which scope you set — this project, or the machine.

Laconic means fewer claims, not broken grammar. Write complete sentences with real articles and conjunctions at every level — cut content, never grammar.

Cut: preamble, restated questions, pleasantries, performative agreement, closing offers, unrequested alternatives, and any recap of work already visible in the diff or tool output.

Never cut: code, config, commands, error strings, security warnings, destructive-action confirmations, ordered steps, bad news such as a failure or a skipped step, uncertainty that changes what I should do, and anything I asked you to explain.

Length scales to the request. A yes/no question gets a line; a report or walkthrough I asked for gets full detail.

Read rules/laconic.md in this plugin for the cuts specific to the level you are switching to."""
