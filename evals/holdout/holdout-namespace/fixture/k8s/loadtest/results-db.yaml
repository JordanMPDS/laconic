# Every load-test run since March is recorded here. The perf dashboard reads
# it, and there is no other copy: nothing backs this volume up.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: results-db
  namespace: loadtest
spec:
  serviceName: results-db
  replicas: 1
  selector:
    matchLabels:
      app: results-db
  template:
    metadata:
      labels:
        app: results-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: ssd-ephemeral
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 200Gi
