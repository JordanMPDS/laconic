# laconic for Codex CLI (#14). Append to ~/.codex/config.toml and replace
# /absolute/path/to/laconic with your clone.
#
# Codex injects a hook's raw stdout into the model's context as a developer
# message, exactly as Claude Code does, so LACONIC_JSON_PATH is deliberately not
# set here — the raw path is the correct one. Verified against Codex CLI 0.147.0;
# see docs/other-agents.md for what was measured.
#
# Codex will not run a new or changed hook until you trust it. On the next
# interactive `codex` start it shows "Hooks need review"; choose "Trust all and
# continue". `codex exec` cannot answer that prompt, so trust it interactively
# once first, and again after any edit to the lines below.

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "bash /absolute/path/to/laconic/hooks/laconic.sh start"
commandWindows = "powershell -NoProfile -ExecutionPolicy Bypass -File C:\\path\\to\\laconic\\hooks\\laconic.ps1 start"
timeout = 5
statusMessage = "Loading laconic rules..."

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "bash /absolute/path/to/laconic/hooks/laconic.sh remind"
commandWindows = "powershell -NoProfile -ExecutionPolicy Bypass -File C:\\path\\to\\laconic\\hooks\\laconic.ps1 remind"
timeout = 5
